[package]
name = "mac-sweep"
version = "0.1.1"
description = "Read-only macOS disk analysis and recoverable cleanup"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12.1", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "=1.10.1"
trash = "=5.2.6"
libc = "0.2"
tauri-plugin-dialog = "=2.7.3"

[profile.release]
strip = true
