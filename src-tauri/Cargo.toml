[package]
name = "mac-sweep"
version = "0.1.7"
description = "Read-only macOS disk analysis and recoverable cleanup"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12.1", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "=1.10.1"
trash = "=5.2.6"
libc = "0.2"
tauri-plugin-dialog = "=2.7.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSRunningApplication"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSObject"] }

[profile.release]
strip = true
